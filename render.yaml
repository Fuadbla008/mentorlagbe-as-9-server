# Render Blueprint: deploy this repo as a web service, then fill the sync:false
# values in the Render dashboard. No code changes are needed for production.
services:
  - type: web
    name: mentorlagbe-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://mentorlagbe-as-9-server.onrender.com
      - key: API_URL
        value: https://mentorlagbe-as-9-server.onrender.com
      - key: CLIENT_URL
        value: https://mentorlagbe-client.vercel.app
      - key: CORS_ORIGIN
        value: https://mentorlagbe-client.vercel.app
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_TUTOR_AMOUNT
        value: "15"
      - key: STRIPE_STUDENT_AMOUNT
        value: "10"
      - key: STRIPE_TUTOR_PRICE_ID
        sync: false
      - key: STRIPE_STUDENT_PRICE_ID
        sync: false
      - key: IMGBB_KEY
        sync: false
      - key: MONGO_TRANSACTIONS
        value: "true"
